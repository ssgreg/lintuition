# Reference configuration: every key lintuition supports, with its default. Copy what you need into
# .lintuition.yml (or .lintuition.yaml), looked up from the working directory upwards.
# The shape follows golangci-lint v2; unknown keys are errors.

version: "2"

run:
  # Timeout for the whole run, including classifier requests. Default: none.
  timeout: 5m
  # Analyse *_test.go files. Default: true.
  tests: true
  build-tags: []
  # Exit code when issues are found. Default: 1. 2 is reserved for an incomplete run.
  issues-exit-code: 1
  # Passed to the go command as -mod: readonly, vendor or mod. Default: the go command's own.
  modules-download-mode: readonly
  # Report paths relative to: wd (default), cfg, gomod, gitroot.
  relative-path-mode: wd

linters:
  # Base set: standard (default), all, none, fast (linters that ask no classifier).
  default: standard
  enable: []
  disable: []
  settings:
    metric-type-vs-help:
      # Minimum probability of the classifier's answer for a finding. Default: 0.8.
      threshold: 0.8
    log-sensitive-field:
      # Minimum probability that the most sensitive field value is a secret. Default: 0.85.
      threshold: 0.85
    log-key-value-role:
      # Minimum probability that a key names a different quantity than its value. Default: 0.85.
      threshold: 0.85
    normal-event-at-error:
      # Minimum probability that an error-level message reports a routine event. Default: 0.9.
      threshold: 0.9
    severe-event-understated:
      # Minimum probability that a debug or info message states an unintended loss. Default: 0.85.
      threshold: 0.85
    destructive-remediation:
      # Minimum probability that a text advises a destructive step. Default: 0.85.
      threshold: 0.85
  exclusions:
    # Generated files: lax (default; also loose "do not edit" markers), strict (the standard header only), disable.
    generated: lax
    # Regular expressions of paths whose issues are dropped; such candidates are never sent.
    paths: []
    # An issue is dropped when it matches every set field of a rule.
    rules:
      - path: _test\.go$
        path-except: ""
        text: ""
        source: ""
        linters: []

issues:
  # Default: 50. 0 means no limit.
  max-issues-per-linter: 50
  # Default: 3. 0 means no limit.
  max-same-issues: 3
  # Report at most one issue per line. Default: true.
  uniq-by-line: true

severity:
  # Severity of issues no rule matches. Default: empty.
  default: ""
  rules:
    - severity: error
      linters: [metric-type-vs-help]

output:
  # Print the run summary to stderr. Problems that make a run incomplete are printed regardless.
  # Default: true.
  show-stats: true
  # Each format needs its own destination; machine-readable formats cannot use stderr.
  formats:
    # Default when no format is set: text to stdout.
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
    json:
      path: lintuition-report.json
    sarif:
      path: lintuition.sarif
    checkstyle:
      path: lintuition-checkstyle.xml
    code-climate:
      path: gl-code-quality-report.json
    junit-xml:
      path: lintuition-junit.xml
    # Workflow-command annotations; golangci-lint v2 dropped this format, lintuition keeps it as an
    # extension. stdout or stderr both reach the job log.
    github-actions:
      path: stderr

# lintuition's extension: the classifier and what may be sent to it.
semantic:
  # The backend to use; see `lintuition classifiers`. Required when a linter asks a classifier.
  classifier: fake
  # Settings per backend. Every listed backend is validated, not only the selected one.
  classifiers:
    fake:
      unmatched: unclear
      rules: []
    jev:
      endpoint: https://api.typesafe.ai/v1/systemone
      # Pin a version for reproducible results; jev-latest moves.
      model: jev-latest
      # The environment variable holding the API key.
      api-key-env: TYPESAFE_API_KEY
      # Per HTTP attempt.
      timeout: 60s
      # Retries for 429, 5xx and transport errors.
      max-retries: 4
      requests-per-minute: 1000
      # USD per million input tokens, for estimates and budgets only.
      price-per-mtok: 0.042
      # Scopes the answer cache to an account. Default: a one-way hash of the API key.
      account: ""
    openai:
      # The API root; /chat/completions is appended. A loopback server (Ollama, llama.cpp) is local.
      base-url: https://api.openai.com/v1
      # Required; there is no default model.
      model: qwen2.5:7b
      # Not needed for a loopback server.
      api-key-env: OPENAI_API_KEY
      # At 0 the model answers the same way every time, so votes above 1 add nothing.
      temperature: 0
      # Least probability the first token must put on the offered option letters.
      min-letter-mass: 0.5
      timeout: 60s
      max-retries: 4
      requests-per-minute: 1000
      # USD per million input tokens, for estimates and budgets; unset means unknown.
      price-per-mtok: 0
      account: ""
    claude-code:
      # The claude executable (default: claude on PATH).
      command: claude
      # Passed as --model; empty means Claude Code's default.
      model: haiku
      # Per run.
      timeout: 180s
      # Runs in flight; every run is a full agent session. Default: 2.
      max-parallel: 2
    codex:
      command: codex
      # Passed as -m; empty means the Codex default.
      model: ""
      # Passed as model_reasoning_effort: low, medium, high.
      reasoning-effort: low
      timeout: 180s
      max-parallel: 2
      # Codex reports tokens, not cost; set a price to estimate it and to allow a money cap.
      price-per-mtok: 0
      # Required to run codex: the Codex CLI keeps a read-only command tool that cannot be switched
      # off, so text in the payload could make it read your files. Default: false.
      accept-agent-tools: false
  # What may leave the machine: facts (structural facts only), prose (default: facts plus
  # person-written text such as comments, metric Help and log messages), source (adds Go source).
  payload: prose
  # Refuse any backend that sends requests off the machine. Default: false.
  local-only: false
  # Requests in flight. Default: 8.
  concurrency: 8
  # Independent samples per candidate: odd, 1 to 9. A strict majority must agree, or the candidate
  # abstains; the rule's threshold applies to the mean probability. Each sample is a request.
  # Agreement of correlated samples is not calibration. Default: 1.
  votes: 1
  # Validated answers are cached by content hash, for backends that declare an identity (jev; not
  # the fake). A cached bundle is a replay, never counted as new votes.
  cache:
    disabled: false
    # Default: the user cache directory (lintuition cache path).
    dir: ""
    # Default: 168h. A moving model alias such as jev-latest needs a bound. Expired records are
    # misses; lintuition cache clean --expired removes them. The cache size is not bounded yet.
    ttl: 168h
  # Caps for one run. 0 means no cap. Reaching one stops new questions: requests in flight finish,
  # every finding made so far is reported, the run counts as incomplete (exit 2), and the summary
  # says how many candidates were not asked. Answers received are cached, so a rerun with a higher
  # cap pays only for the rest. A remote backend that cannot price its calls (codex, openai without
  # price-per-mtok) refuses max-cost-usd rather than ignore it; a local one needs no cap.
  budget:
    max-requests: 0
    max-cost-usd: 0
