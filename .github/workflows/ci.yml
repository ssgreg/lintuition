name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: example plugins
        run: |
          for d in examples/plugins/*/; do (cd "$d" && GOWORK=off go vet ./...); done
      - name: sample runs offline with the fake classifier
        run: |
          go build -o /tmp/lintuition ./cmd/lintuition
          cd examples/sample
          set +e; /tmp/lintuition run ./...; code=$?; set -e
          test "$code" = 1
