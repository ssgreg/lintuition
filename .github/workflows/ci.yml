name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.26 patch, for the standard library's security fixes; go.mod keeps 1.26.0 as
          # the minimum users need.
          go-version: "1.26"
          check-latest: true
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: example modules build
        run: |
          for d in examples/sample examples/showcase examples/plugins/*/; do
            (cd "$d" && GOWORK=off go vet ./...)
          done
      - name: the sample runs offline with the fake classifier
        run: |
          go build -o "$RUNNER_TEMP/lintuition" ./cmd/lintuition
          cd examples/sample
          set +e; "$RUNNER_TEMP/lintuition" run ./...; code=$?; set -e
          test "$code" = 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.26 patch, for the standard library's security fixes; go.mod keeps 1.26.0 as
          # the minimum users need.
          go-version: "1.26"
          check-latest: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The newest 1.26 patch, for the standard library's security fixes; go.mod keeps 1.26.0 as
          # the minimum users need.
          go-version: "1.26"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
