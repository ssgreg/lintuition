name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch, for the standard library's security fixes; go.mod keeps 1.26.0 as
          # the minimum users need.
          go-version: "1.26"
          check-latest: true
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: example modules build
        run: |
          for d in examples/sample examples/showcase examples/plugins/*/; do
            (cd "$d" && GOWORK=off go vet ./...)
          done
      - name: the sample runs offline with the fake classifier
        run: |
          # The sample's finding looks like a Go compiler error; keep setup-go's problem matcher from
          # turning it into an error annotation on a green job.
          echo "::remove-matcher owner=go::"
          go build -o "$RUNNER_TEMP/lintuition" ./cmd/lintuition
          cd examples/sample
          set +e; "$RUNNER_TEMP/lintuition" run ./...; code=$?; set -e
          test "$code" = 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch, for the standard library's security fixes; go.mod keeps 1.26.0 as
          # the minimum users need.
          go-version: "1.26"
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch, for the standard library's security fixes; go.mod keeps 1.26.0 as
          # the minimum users need.
          go-version: "1.26"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
