# A short working config. Copy it to .lintuition.yml and export TYPESAFE_API_KEY.
# Every key with its default: .lintuition.reference.yml.
version: "2"

run:
  # Findings are review hints: report them, do not fail the build on them.
  issues-exit-code: 0

linters:
  default: standard

semantic:
  classifier: jev
  classifiers:
    jev:
      model: jev-latest
  # Person-written text (comments, Help, log messages, test names) is sent; Go source is not.
  payload: prose
  # A paid backend always gets a money cap. Reaching it stops new questions; what was found is
  # still reported, answers already received are cached, and a rerun pays only for the rest.
  budget:
    max-requests: 2000
    max-cost-usd: 1
