version: "2"

linters:
  default: none
  enable: [doc-vs-signature, read-only-promise, metric-type-vs-help, premature-success, table-case-vs-expectation, sentinel-name-vs-text, error-needs-type, human-unit-contradiction, enum-comment-shift, test-name-vs-assertion, doc-vs-table, suppression-rationale, log-sensitive-field, log-key-value-role, normal-event-at-error, severe-event-understated, destructive-remediation]

semantic:
  classifier: fake
  classifiers:
    fake:
      # Every question must be scripted: an unscripted one fails the run instead of passing quietly.
      unmatched: error
      rules:
        # metric-type-vs-help
        - {question: kind, when: "Disk I/O utilization", choice: current, probability: 0.9}
        - {question: kind, when: "Total seconds spent", choice: total, probability: 0.95}
        - {question: kind, when: "since the process started", choice: total, probability: 0.9}
        - {question: kind, when: "running now", choice: current, probability: 0.95}
        - {question: kind, when: "See the runbook", choice: unclear, probability: 0.8}
        # premature-success
        - {question: claim, when: "config saved to disk", choice: completed, probability: 0.7}
        - {question: claim, when: "saving config", choice: starting, probability: 0.9}
        - {question: claim, when: "upload 3 of 5", choice: progress, probability: 0.9}
        # table-case-vs-expectation
        - {question: outcome, when: "expired when the deadline", choice: "true", probability: 0.95}
        - {question: outcome, when: "not expired before the deadline", choice: "false", probability: 0.95}
        - {question: outcome, when: "passed=false", choice: unstated, probability: 0.9}
        - {question: outcome, when: "whether expired", choice: "false", probability: 0.95}
        - {question: outcome, when: "whether valid", choice: "true", probability: 0.95}
        # log-sensitive-field
        - {linter: log-sensitive-field, question: role, when: "value req.Password", choice: secret, probability: 0.95}
        - {linter: log-sensitive-field, question: role, when: "value req.User", choice: personal, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "value req.TokenID", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"retrying upload\"", choice: public, probability: 0.95}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"cache miss, loading from the database\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"disk quota exceeded, uploads are paused\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"failed to save the upload\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"client disconnected before the response was written\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"streaming search results to the caller\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"accept loop finished, the listener was closed for shutdown\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"feed poll retry scheduled in 30 seconds\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"closing the metrics listener\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"applying the new configuration\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"replaying the journal\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"shutting down the feed poller\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"tailing the access log\"", choice: public, probability: 0.9}
        - {linter: log-sensitive-field, question: role, when: "\"message\":\"tailing the access log was stopped by its caller\"", choice: public, probability: 0.9}
        # log-key-value-role
        - {linter: log-key-value-role, question: role, when: "key remaining_attempts, value elapsedAttempts", choice: conflict, probability: 0.9}
        - {linter: log-key-value-role, question: role, when: "key attempts_made, value elapsedAttempts", choice: same, probability: 0.9}
        - {linter: log-key-value-role, question: role, when: "key remaining_attempts, value v,", choice: insufficient, probability: 0.9}
        # normal-event-at-error
        - {linter: normal-event-at-error, question: event, when: "cache miss, loading from the database", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "disk quota exceeded, uploads are paused", choice: degradation, probability: 0.9}
        - {linter: normal-event-at-error, question: event, when: "queue full, event dropped and not retried", choice: failure, probability: 0.9}
        - {linter: normal-event-at-error, question: event, when: "planned failover to the standby completed", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "client disconnected before the response was written", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "streaming search results to the caller", choice: routine, probability: 0.92}
        - {linter: normal-event-at-error, question: event, when: "accept loop finished, the listener was closed", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "feed poll retry scheduled", choice: routine, probability: 0.9}
        - {linter: normal-event-at-error, question: event, when: "closing the metrics listener", choice: failure, probability: 0.95}
        # read alone, the message is routine; the operation answer with the unidentified error keeps it clean
        - {linter: normal-event-at-error, question: event, when: "applying the new configuration", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "replaying the journal", choice: failure, probability: 0.9}
        - {linter: normal-event-at-error, question: event, when: "the journal is unreadable, recovery stopped", choice: failure, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "shutting down the feed poller", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "tailing the access log was stopped by its caller", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: operation, when: "tailing the access log was stopped by its caller", choice: action, probability: 0.95}
        - {linter: normal-event-at-error, question: event, when: "tailing the access log", choice: routine, probability: 0.95}
        - {linter: normal-event-at-error, question: operation, when: "tailing the access log", choice: action, probability: 0.95}
        # the operation question is asked only for a call that carries an error the code did not identify
        - {linter: normal-event-at-error, question: operation, when: "feed poll retry scheduled", choice: outcome, probability: 0.95}
        - {linter: normal-event-at-error, question: operation, when: "closing the metrics listener", choice: action, probability: 0.95}
        - {linter: normal-event-at-error, question: operation, when: "applying the new configuration", choice: action, probability: 0.9}
        - {linter: normal-event-at-error, question: operation, when: "replaying the journal", choice: action, probability: 0.9}
        - {linter: normal-event-at-error, question: operation, when: "disk quota exceeded, uploads are paused", choice: outcome, probability: 0.95}
        # severe-event-understated
        - {linter: severe-event-understated, question: consequence, when: "queue full, event dropped and not retried", choice: unintended_loss, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "queue full, event dropped and not retried", yes: 0.1}
        - {linter: severe-event-understated, question: consequence, when: "deleted expired sessions as requested", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "deleted expired sessions as requested", yes: 0.95}
        - {linter: severe-event-understated, question: consequence, when: "dropped by the sampler as configured", choice: unintended_loss, probability: 0.9}
        - {linter: severe-event-understated, question: on_purpose, when: "dropped by the sampler as configured", yes: 0.9}
        # severe-event-understated reads every info and debug message, the other linters' twins too.
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"user signed in\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"user signed in\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"token rotated\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"token rotated\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"cache miss, loading from the database\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"cache miss, loading from the database\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"client disconnected before the response was written\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"client disconnected before the response was written\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"config saved to disk\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"config saved to disk\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"saving config to disk\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"saving config to disk\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"cache warmed\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"cache warmed\"", yes: 0.5}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"upload 3 of 5\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"upload 3 of 5\"", yes: 0.5}
        # destructive-remediation
        - {linter: destructive-remediation, question: advice, when: "delete the repository directory and run init again", choice: destructive_advice, probability: 0.95}
        - {linter: destructive-remediation, question: states_loss, when: "delete the repository directory and run init again", yes: 0.1}
        - {linter: destructive-remediation, question: advice, when: "erases every stored backup, so copy it elsewhere first", choice: destructive_advice, probability: 0.95}
        - {linter: destructive-remediation, question: states_loss, when: "erases every stored backup, so copy it elsewhere first", yes: 0.95}
        - {linter: destructive-remediation, question: advice, when: "remove the --dry-run flag to apply the plan", choice: safe_advice, probability: 0.9}
        - {linter: destructive-remediation, question: states_loss, when: "remove the --dry-run flag to apply the plan", yes: 0.2}
        - {linter: destructive-remediation, question: advice, when: "lock file was removed by another process", choice: no_advice, probability: 0.95}
        - {linter: destructive-remediation, question: states_loss, when: "lock file was removed by another process", yes: 0.2}
        - {linter: destructive-remediation, question: advice, when: "data volume is unreadable; format it", choice: destructive_advice, probability: 0.95}
        - {linter: destructive-remediation, question: states_loss, when: "data volume is unreadable; format it", yes: 0.1}
        - {linter: destructive-remediation, question: advice, when: "drop the index folder and start the service again", choice: destructive_advice, probability: 0.95}
        - {linter: destructive-remediation, question: states_loss, when: "drop the index folder and start the service again", yes: 0.1}
        - {linter: destructive-remediation, question: advice, when: "wipe the ledger and resync from scratch", choice: destructive_advice, probability: 0.95}
        - {linter: destructive-remediation, question: states_loss, when: "wipe the ledger and resync from scratch", yes: 0.1}
        - {linter: destructive-remediation, question: advice, when: "removing it loses only cached thumbnails", choice: destructive_advice, probability: 0.9}
        - {linter: destructive-remediation, question: states_loss, when: "removing it loses only cached thumbnails", yes: 0.9}
        - {linter: destructive-remediation, question: advice, when: "the replica has to be dropped", choice: own_action, probability: 0.9}
        - {linter: destructive-remediation, question: states_loss, when: "the replica has to be dropped", yes: 0.1}
        - {linter: destructive-remediation, question: advice, when: "purge staging bucket: %w", choice: own_action, probability: 0.9}
        - {linter: destructive-remediation, question: states_loss, when: "purge staging bucket: %w", yes: 0.1}
        # destructive-remediation does not read info and debug logs: "drop expired archive" and
        # "purge the upload queue" are never asked, and a rule for them would only hide that.
        # destructive-remediation asks about every constant error text and every warn-or-above log
        # text, every other twin's too. Those are reports, not advice: one answer for the rest, after the specific ones above.
        - {linter: destructive-remediation, question: advice, choice: no_advice, probability: 0.9}
        - {linter: destructive-remediation, question: states_loss, yes: 0.5}
        # sentinel-name-vs-text
        - {linter: sentinel-name-vs-text, question: condition, when: "tenant record not found", choice: different, probability: 0.8}
        - {linter: sentinel-name-vs-text, question: condition, when: "tenant storage quota exceeded", choice: same, probability: 0.9}
        - {linter: sentinel-name-vs-text, question: condition, when: "backend hiccup", choice: insufficient, probability: 0.8}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"drop expired archive\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"drop expired archive\"", yes: 0.9}
        - {linter: severe-event-understated, question: consequence, when: "\"message\":\"purge the upload queue\"", choice: routine, probability: 0.95}
        - {linter: severe-event-understated, question: on_purpose, when: "\"message\":\"purge the upload queue\"", yes: 0.9}
        - {linter: sentinel-name-vs-text, question: condition, when: "cached lease is outdated", choice: different, probability: 0.5}
        # (the sentinel of error-needs-type's fixed twin)
        - {linter: sentinel-name-vs-text, question: condition, when: "invoice does not exist", choice: same, probability: 0.9}
        # error-needs-type
        - {linter: error-needs-type, question: branchable, when: "invoice not found", yes: 0.9}
        - {linter: error-needs-type, question: branchable, when: "invoice ledger invariant broken", yes: 0.1}
        - {linter: error-needs-type, question: branchable, when: "invoice payload rejected", yes: 0.6}
        # human-unit-contradiction
        - {linter: human-unit-contradiction, question: unit, when: "compaction took %.0f ms", choice: milliseconds, probability: 0.9}
        - {linter: human-unit-contradiction, question: unit, when: "compaction took %d ms", choice: milliseconds, probability: 0.95}
        - {linter: human-unit-contradiction, question: unit, when: "compaction retry, backoff factor", choice: unspecified, probability: 0.9}
        - {linter: human-unit-contradiction, question: unit, when: "compaction window %.0f", choice: minutes, probability: 0.6}
        # enum-comment-shift
        - {linter: enum-comment-shift, question: describes, when: "a replication job waiting for a free worker", choice: PhaseQueued, probability: 0.95}
        - {linter: enum-comment-shift, question: describes, when: "every block has been copied and verified", choice: PhaseVerified, probability: 0.9}
        - {linter: enum-comment-shift, question: describes, when: "replica without letting writes through", choice: ModeReadOnly, probability: 0.95}
        - {linter: enum-comment-shift, question: describes, when: "replica for writes too", choice: ModeReadWrite, probability: 0.95}
        - {linter: enum-comment-shift, question: describes, when: "Replica storage tiers, fastest first", choice: none, probability: 0.9}
        - {linter: enum-comment-shift, question: describes, when: "replica tier kept for a while", choice: TierWarm, probability: 0.5}
        # (the twin's own want comment is a line comment on a constant too: a note, no constant)
        - {linter: enum-comment-shift, question: describes, when: "want `comment describes PhaseVerified", choice: none, probability: 0.9}
        # (the sentinel of test-name-vs-assertion's twin package: name and text agree)
        - {linter: sentinel-name-vs-text, question: condition, when: "unbalanced quote", choice: same, probability: 0.9}
        # test-name-vs-assertion
        - {linter: test-name-vs-assertion, question: name_says, when: "unquote rejects unbalanced quote", choice: error, probability: 0.95}
        - {linter: test-name-vs-assertion, question: name_says, when: "unquote accepts quoted word", choice: no_error, probability: 0.95}
        - {linter: test-name-vs-assertion, question: name_says, when: "unquote empty string", choice: input_only, probability: 0.95}
        # doc-vs-table
        - {linter: doc-vs-table, question: condition, when: '"situation":"three days late', choice: met, probability: 0.95}
        - {linter: doc-vs-table, question: condition, when: '"situation":"a week before the date', choice: not_met, probability: 0.95}
        - {linter: doc-vs-table, question: condition, when: '"situation":"invoice in another currency"', choice: not_covered, probability: 0.9}
        # table-case-vs-expectation's rows are doc-vs-table candidates too: Expired has a doc
        - {linter: doc-vs-table, question: condition, when: 'passed.","situation":"expired when the deadline', choice: met, probability: 0.95}
        - {linter: doc-vs-table, question: condition, when: 'passed.","situation":"not expired before the deadline', choice: not_met, probability: 0.95}
        - {linter: doc-vs-table, question: condition, when: 'passed.","situation":"passed=false"', choice: not_met, probability: 0.9}
        # doc-vs-table's rows, for table-case-vs-expectation: their names say nothing about the result
        - {linter: table-case-vs-expectation, question: outcome, when: '"about":"the result of Due"', choice: unstated, probability: 0.9}
        # suppression-rationale
        - {linter: suppression-rationale, question: about, when: "the file is small, so reading it whole", choice: elsewhere, probability: 0.9}
        - {linter: suppression-rationale, question: about, when: "a close error on a file opened read-only", choice: addresses, probability: 0.9}
        - {linter: suppression-rationale, question: about, when: "only the tests call this function", choice: elsewhere, probability: 0.9}
        - {linter: suppression-rationale, question: about, when: "one flat switch over every opcode", choice: addresses, probability: 0.9}
        - {linter: suppression-rationale, question: about, when: "a URL in a string cannot be wrapped", choice: addresses, probability: 0.95}
        - {linter: suppression-rationale, question: about, when: "the buffer is small // errors from this best-effort cleanup", choice: addresses, probability: 0.9}
        # a reason cut at its second // would match this rule and be reported
        - {linter: suppression-rationale, question: about, when: '"rationale":"the buffer is small"', choice: elsewhere, probability: 0.9}
        # (destructive-remediation's twins are plain string errors, for error-needs-type: none is branchable)
        - {linter: error-needs-type, question: branchable, when: "backup index mismatch", yes: 0.1}
        - {linter: error-needs-type, question: branchable, when: "remove the --dry-run flag to apply the plan", yes: 0.1}
        - {linter: error-needs-type, question: branchable, when: "lock file was removed by another process", yes: 0.2}
        - {linter: error-needs-type, question: branchable, when: "data volume is unreadable; format it", yes: 0.2}
        # doc-vs-signature
        - {linter: doc-vs-signature, question: returns_result, when: "flushes the buffer and returns the number of bytes", yes: 0.95}
        - {linter: doc-vs-signature, question: returns_error, when: "returns an error if the name is empty", yes: 0.95}
        - {linter: doc-vs-signature, question: returns_result, when: "reports whether the queue has no items", yes: 0.95}
        - {linter: doc-vs-signature, question: returns_result, when: "removes every item from the queue", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "stores v and returns the old value", yes: 0.95}
        - {linter: doc-vs-signature, question: returns_error, when: "parses s and returns an error on malformed input", yes: 0.95}
        - {linter: doc-vs-signature, question: returns_error, when: "returns ErrClosed if the pool is closed", yes: 0.9}
        - {linter: doc-vs-signature, question: returns_result, when: "returns any errors, and returns the entry to a pool", yes: 0.9}
        - {linter: doc-vs-signature, question: returns_result, when: "returns all descriptions of the collector", yes: 0.9}
        - {linter: doc-vs-signature, question: returns_result, when: "returns all observations through ch", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "writes the state as JSON to w", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "yields every item to yield", yes: 0.1}
        - {linter: doc-vs-signature, question: returns_result, when: "blocks and returns when ctx is done", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "returns c into the pool", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "whenever check returns false", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "it returns nothing", yes: 0.02}
        - {linter: doc-vs-signature, question: returns_error, when: "logs an error when the counter overflows", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_error, when: "records the last error", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_error, when: "panics with an error if s is empty", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_error, when: "passes it an error for a broken one", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_error, when: "formats the error for display", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_error, when: "wraps the message of an error", yes: 0.1}
        - {linter: doc-vs-signature, question: returns_error, when: "how many times Do returned an error", yes: 0.05}
        - {linter: doc-vs-signature, question: returns_result, when: "returns once the queue is empty", yes: 0.5}
        # (normal-event-at-error's twin: its doc mentions an error, the function returns a string)
        - {linter: doc-vs-signature, question: returns_error, when: "a cache miss is the cache working as designed", yes: 0.05}
        # read-only-promise
        - {linter: read-only-promise, question: promises_unchanged, when: "returns the next item without altering the queue", yes: 0.95}
        - {linter: read-only-promise, question: promises_unchanged, when: "is pure: the same input gives the same result", yes: 0.95}
        - {linter: read-only-promise, question: promises_unchanged, when: "returns the median of xs, leaving xs unchanged", yes: 0.95}
        - {linter: read-only-promise, question: promises_unchanged, when: "returns the value for k and does not modify the cache", yes: 0.9}
        - {linter: read-only-promise, question: promises_unchanged, when: "adds up xs without modifying xs", yes: 0.05}
        - {linter: read-only-promise, question: promises_unchanged, when: "does not change the file's permissions", yes: 0.05}
        - {linter: read-only-promise, question: promises_unchanged, when: "the capacity stays unchanged", yes: 0.1}
        - {linter: read-only-promise, question: promises_unchanged, when: "callers see no change", yes: 0.6}
        - {linter: read-only-promise, question: promises_unchanged, when: "on an empty queue it returns false and leaves the queue unchanged", yes: 0.1}
        - {linter: read-only-promise, question: promises_unchanged, when: "it does not modify the flags of the command", yes: 0.1}
        - {linter: read-only-promise, question: promises_unchanged, when: "returns the command's name and leaves the command untouched", yes: 0.95}
        - {linter: read-only-promise, question: promises_unchanged, when: "except filling the internal cache", yes: 0.1}
        - {linter: read-only-promise, question: promises_unchanged, when: "compares n with Limit and leaves Limit unchanged", yes: 0.95}
        # (other linters' twins whose functions write state: their docs promise nothing about it)
        - {linter: read-only-promise, question: promises_unchanged, yes: 0.05}
